      function getRandomWords(count = 20, pool = POOL_100_NATURE_WORDS) {
        const cloned = [...pool];
        for (let i = cloned.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
        }
        return cloned.slice(0, count);
      }

      // =========================================================================
      // 3. KOREAN IME & STROKE ENGINE (자모 분해, 정확도 및 CPM 측정)
      // =========================================================================
      const CHO_LIST = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
      const JUNG_LIST = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
      const JONG_LIST = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

      const CHO_STROKES = { 'ㄱ': 1, 'ㄲ': 2, 'ㄴ': 1, 'ㄷ': 1, 'ㄸ': 2, 'ㄹ': 1, 'ㅁ': 1, 'ㅂ': 1, 'ㅃ': 2, 'ㅅ': 1, 'ㅆ': 2, 'ㅇ': 1, 'ㅈ': 1, 'ㅉ': 2, 'ㅊ': 1, 'ㅋ': 1, 'ㅌ': 1, 'ㅍ': 1, 'ㅎ': 1 };
      const JUNG_STROKES = { 'ㅏ': 1, 'ㅐ': 2, 'ㅑ': 1, 'ㅒ': 2, 'ㅓ': 1, 'ㅔ': 2, 'ㅕ': 1, 'ㅖ': 2, 'ㅗ': 1, 'ㅘ': 2, 'ㅙ': 3, 'ㅚ': 2, 'ㅛ': 1, 'ㅜ': 1, 'ㅝ': 2, 'ㅞ': 3, 'ㅟ': 2, 'ㅠ': 1, 'ㅡ': 1, 'ㅢ': 2, 'ㅣ': 1 };
      const JONG_STROKES = { '': 0, 'ㄱ': 1, 'ㄲ': 2, 'ㄳ': 2, 'ㄴ': 1, 'ㄵ': 2, 'ㄶ': 2, 'ㄷ': 1, 'ㄹ': 1, 'ㄺ': 2, 'ㄻ': 2, 'ㄼ': 2, 'ㄽ': 2, 'ㄾ': 2, 'ㄿ': 2, 'ㅀ': 2, 'ㅁ': 1, 'ㅂ': 1, 'ㅄ': 2, 'ㅅ': 1, 'ㅆ': 2, 'ㅇ': 1, 'ㅈ': 1, 'ㅊ': 1, 'ㅋ': 1, 'ㅌ': 1, 'ㅍ': 1, 'ㅎ': 1 };

      function decomposeChar(char) {
        const code = char.charCodeAt(0);
        if (code >= 0xac00 && code <= 0xd7a3) {
          const syllableIndex = code - 0xac00;
          const jongIndex = syllableIndex % 28;
          const jungIndex = Math.floor((syllableIndex - jongIndex) / 28) % 21;
          const choIndex = Math.floor((syllableIndex - jongIndex) / (28 * 21));

          const cho = CHO_LIST[choIndex];
          const jung = JUNG_LIST[jungIndex];
          const jong = JONG_LIST[jongIndex];
          const strokes = (CHO_STROKES[cho] || 1) + (JUNG_STROKES[jung] || 1) + (JONG_STROKES[jong] || 0);

          return { char, isHangul: true, cho, jung, jong, strokes };
        }
        return { char, isHangul: false, strokes: 1 };
      }

      function countKoreanStrokes(text) {
        let count = 0;
        for (let i = 0; i < text.length; i++) {
          count += decomposeChar(text[i]).strokes;
        }
        return count;
      }

      function calculateCPM(strokes, elapsedSeconds) {
        if (elapsedSeconds <= 0 || strokes <= 0) return 0;
        return Math.round((strokes / elapsedSeconds) * 60);
      }

            osc.frequency.setValueAtTime(420 + Math.random() * 40, this.ctx.currentTime);

            gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);

            gain.connect(this.ctx.destination);

            osc.stop(this.ctx.currentTime + 0.04);

      class BGMManager {
        constructor() {
          this.audio = null;
          this.isPlaying = false;
          this.volume = 0.35;
          this.isPausedByUser = localStorage.getItem('bgm_paused_by_user') === 'true';
          const savedVol = localStorage.getItem('bgm_volume');
          if (savedVol !== null) {
            const p = parseFloat(savedVol);
            if (!isNaN(p) && p >= 0 && p <= 1) this.volume = p;
          }
          this.listeners = new Set();
          this.userInteracted = false;
          this.setupAutoPlay();
        }

        initAudio() {
          if (this.audio) return;
          try {
            // Supports same-directory relative mp3 path for GitHub Pages and local double-click
            this.audio = new Audio('./cybernetic-overload.mp3');
            this.audio.loop = true;
            this.audio.volume = this.volume;
            this.audio.preload = 'auto';

            this.audio.addEventListener('play', () => {
              this.isPlaying = true;
              this.notify();
            });
            this.audio.addEventListener('pause', () => {
              this.isPlaying = false;
              this.notify();
            });
            this.audio.addEventListener('error', () => {
              // Fallback to /cybernetic-overload.mp3 or public/cybernetic-overload.mp3
              if (this.audio && !this.audio.src.includes('public/')) {
                this.audio.src = '../public/cybernetic-overload.mp3';
              }
            });
          } catch (e) {
            console.warn('Audio init error', e);
          }
        }

        setupAutoPlay() {
          const handleGesture = () => {
            if (this.userInteracted) return;
            this.userInteracted = true;
            if (!this.isPausedByUser) {
              this.play().catch(() => {});
            }
            window.removeEventListener('pointerdown', handleGesture);
            window.removeEventListener('keydown', handleGesture);
          };
          window.addEventListener('pointerdown', handleGesture, { passive: true });
          window.addEventListener('keydown', handleGesture, { passive: true });
        }

        async play(force = false) {
          if (!force && this.isPausedByUser) return;
          this.initAudio();
          if (!this.audio) return;
          try {
            this.audio.volume = this.volume;
            await this.audio.play();
            this.isPlaying = true;
            this.notify();
          } catch {}
        }

        pause() {
          if (!this.audio) return;
          this.audio.pause();
          this.isPlaying = false;
          this.notify();
        }

        stop() {
          if (!this.audio) return;
          this.audio.pause();
          try { this.audio.currentTime = 0; } catch {}
          this.isPlaying = false;
          this.notify();
        }

        togglePlay() {
          if (this.isPlaying) {
            this.isPausedByUser = true;
            localStorage.setItem('bgm_paused_by_user', 'true');
            this.pause();
            return false;
          } else {
            this.isPausedByUser = false;
            localStorage.setItem('bgm_paused_by_user', 'false');
            this.play(true).catch(() => {});
            return true;
          }
        }

        setVolume(val) {
          this.volume = Math.max(0, Math.min(1, val));
          if (this.audio) this.audio.volume = this.volume;
          localStorage.setItem('bgm_volume', String(this.volume));
          this.notify();
        }

        subscribe(fn) {
          this.listeners.add(fn);
          fn({ isPlaying: this.isPlaying, volume: this.volume, isPausedByUser: this.isPausedByUser });
          return () => this.listeners.delete(fn);
        }

        notify() {
          const state = { isPlaying: this.isPlaying, volume: this.volume, isPausedByUser: this.isPausedByUser };
          this.listeners.forEach((fn) => fn(state));
        }

        getState() {
          return { isPlaying: this.isPlaying, volume: this.volume, isPausedByUser: this.isPausedByUser };
        }
      }

      const RANKING_STORAGE_KEY = 'typingRanking';

      function getFormattedCurrentDate(date = new Date()) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        const hh = String(date.getHours()).padStart(2, '0');
        const min = String(date.getMinutes()).padStart(2, '0');
        return `${yyyy}.${mm}.${dd} ${hh}:${min}`;
      }

      function getTypingRankingList() {
        try {
          const raw = localStorage.getItem(RANKING_STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed.slice(0, 10);
        } catch {}
        return [];
      }

      function calculateDisplayRankings(list, newRecordRef) {
        const ranked = [];
        for (let i = 0; i < list.length; i++) {
          let rank = 1;
          if (i === 0) {
            rank = 1;
          } else {
            if (list[i].점수 === list[i - 1].점수) {
              rank = ranked[i - 1].순위;
            } else {
              rank = i + 1;
            }
          }

          const isNew = Boolean(
            newRecordRef &&
            list[i].이름 === newRecordRef.이름 &&
            list[i].날짜 === newRecordRef.날짜 &&
            list[i].점수 === newRecordRef.점수
          );

          ranked.push({
            ...list[i],
            순위: rank,
            originalIndex: i,
            isNew,
          });
        }
        return ranked;
      }

      function getProcessedRankings(newRecordRef) {
        const list = getTypingRankingList();
        return calculateDisplayRankings(list, newRecordRef);
      }

      function saveTypingRecord(name, score) {
        const formattedDate = getFormattedCurrentDate();
        const newRecord = {
          날짜: formattedDate,
          이름: name.slice(0, 8),
          점수: score,
        };

        const existingList = getTypingRankingList();
        const combined = [
          ...existingList.map((item, idx) => ({ ...item, originalIndex: idx })),
          { ...newRecord, originalIndex: existingList.length },
        ];

        combined.sort((a, b) => {
          if (b.점수 !== a.점수) return b.점수 - a.점수;
          return a.originalIndex - b.originalIndex;
        });

        const top10WithIndex = combined.slice(0, 10);
        const top10ToStore = top10WithIndex.map((item) => ({
          날짜: item.날짜,
          이름: item.이름,
          점수: item.점수,
        }));

        try {
          localStorage.setItem(RANKING_STORAGE_KEY, JSON.stringify(top10ToStore));
        } catch {}

        const rankings = calculateDisplayRankings(top10ToStore, newRecord);
        const found = rankings.find((r) => r.isNew);
        const userRank = found ? found.순위 : null;

        return { savedItem: newRecord, rankings, userRank };
      }

      function clearAllTypingRankings() {
        try {
          localStorage.removeItem(RANKING_STORAGE_KEY);
        } catch {}
      }

                        min="0"
                        max="1"
                        step="0.05"
                        value={bgmState.volume}
                        onChange={(e) => bgm.setVolume(parseFloat(e.target.value))}
                        className="w-full accent-amber-400 h-1.5 bg-emerald-800 rounded-lg cursor-pointer"
                      />
                      <span className="text-[11px] font-bold text-amber-300 w-8 text-right">
                        {Math.round(bgmState.volume * 100)}%
                      </span>
                    </div>
                  )}
                </div>

                {/* 🏆 명예의 전당 버튼 */}
                <button
                  onClick={onOpenHallOfFame}
                  className="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-gradient-to-r from-amber-500/30 to-yellow-500/20 hover:from-amber-500/40 hover:to-yellow-500/30 text-amber-300 border border-amber-400/60 text-xs sm:text-sm font-black transition-all shadow-sm active:scale-95 cursor-pointer"
                  title="명예의 전당 순위표 보기"
                >
                  <span className="text-sm">🏆</span>
                  <span>명예의 전당</span>
                </button>

                {/* 단계 표시 및 선택 버튼 */}
                <button
                  onClick={onOpenStageSelect}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-800/80 hover:bg-emerald-700/80 text-emerald-100 border border-emerald-600/50 text-sm font-semibold transition-all shadow-sm active:scale-95"
                  title="단계 선택 및 100개 단어 도감"
                >
                  <Icon name="book-open" className="w-4 h-4 text-emerald-300" />
                  <span className="font-bold text-amber-300">{currentStage}</span>
                  <span className="text-emerald-300">/ {totalStages}단계</span>
                </button>

                {/* 20단어 재추출 */}
                <button
                  onClick={onShuffleWords}
                  className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-teal-800/70 hover:bg-teal-700 text-teal-200 border border-teal-600/60 text-xs font-bold transition-all active:scale-95 shadow-sm"
                  title="100개 단어 중 새로운 랜덤 20개 단어 뽑기"
                >
                  <Icon name="rotate-ccw" className="w-3.5 h-3.5 text-amber-300" />
                  <span className="hidden sm:inline">랜덤 20단어 섞기</span>
                </button>

                {/* 글씨 확대 토글 */}
                <button
                  onClick={onToggleFontSize}
                  className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all border ${
                    isLargeFont
                      ? 'bg-amber-500/20 text-amber-300 border-amber-500/50'
                      : 'bg-emerald-800/60 text-emerald-200 border-emerald-700/60 hover:bg-emerald-700/60'
                  }`}
                  title="글씨 크기 (2배 / 2.5배 초대형)"
                >
                  글씨: {isLargeFont ? '초대형' : '2배 큰글'}
                </button>

                {/* 효과음 토글 */}
                <button
                  onClick={onToggleMute}
                  className="p-2 rounded-lg bg-emerald-800/60 hover:bg-emerald-700/70 text-emerald-200 border border-emerald-700/60 transition-all active:scale-95"
                  title={isMuted ? '효과음 켜기' : '효과음 끄기'}
                >
                  {isMuted ? <Icon name="volume-x" className="w-4 h-4 text-rose-300" /> : <Icon name="volume-2" className="w-4 h-4 text-emerald-300" />}
                </button>

                {/* 현재 단계 다시 시작 */}
                <button
                  onClick={onRestartCurrent}
                  className="p-2 rounded-lg bg-emerald-800/60 hover:bg-emerald-700/70 text-emerald-200 border border-emerald-700/60 transition-all active:scale-95"
                  title="현재 단계 다시 시작"
                >
                  <Icon name="rotate-ccw" className="w-4 h-4 text-emerald-300" />
                </button>
              </div>
            </div>
          </header>
        );
      };

      // --- StageProgress Component ---
      const STAGE_ICONS = ['🌱', '🌿', '🌲', '🌳', '🌺', '👑', '🏆'];

      const StageProgress = ({ currentStage, completedStages, currentWordIndex, totalWordsInStage }) => {
        return (
          <div className="w-full bg-emerald-950/80 border border-emerald-800/60 rounded-2xl p-3.5 shadow-md">
            <div className="flex items-center justify-between relative mb-3">
              <div className="absolute top-1/2 left-4 right-4 h-1 bg-emerald-900 -translate-y-1/2 z-0" />
              <div
                className="absolute top-1/2 left-4 h-1 bg-gradient-to-r from-emerald-400 to-amber-400 -translate-y-1/2 z-0 transition-all duration-500"
                style={{
                  width: `${Math.min(100, Math.max(0, ((currentStage - 1) / (STAGE_CONFIGS.length - 1)) * 100))}%`,
                }}
              />

              {STAGE_CONFIGS.map((stageItem) => {
                const isDone = completedStages.includes(stageItem.stage);
                const isCurrent = stageItem.stage === currentStage;

                return (
                  <div key={stageItem.stage} className="relative z-10 flex flex-col items-center">
                    <div
                      className={`w-9 h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center font-bold text-sm transition-all duration-300 shadow-md ${
                        isCurrent
                          ? 'bg-amber-400 text-amber-950 ring-4 ring-amber-400/40 scale-110 animate-pulse'
                          : isDone
                          ? 'bg-emerald-500 text-white ring-2 ring-emerald-400/50'
                          : 'bg-emerald-900 text-emerald-400 border border-emerald-700'
                      }`}
                    >
                      {isDone ? (
                        <Icon name="check" className="w-5 h-5 stroke-[3]" />
                      ) : (
                        <span className="text-base select-none">{STAGE_ICONS[stageItem.stage - 1]}</span>
                      )}
                    </div>
                    <span
                      className={`text-[11px] md:text-xs font-semibold mt-1 transition-colors ${
                        isCurrent ? 'text-amber-300 font-bold' : isDone ? 'text-emerald-300' : 'text-emerald-500'
                      }`}
                    >
                      {stageItem.stage}단계
                    </span>
                  </div>
                );
              })}
            </div>

            <div className="flex flex-col sm:flex-row sm:items-center justify-between pt-2 border-t border-emerald-800/60 text-xs gap-2">
              <div className="flex items-center gap-2 flex-1">
                <span className="font-semibold text-emerald-300 shrink-0">단어 진행:</span>
                <div className="flex items-center gap-1 flex-1 max-w-md">
                  {Array.from({ length: totalWordsInStage }).map((_, idx) => {
                    const isWordCompleted = idx < currentWordIndex;
                    const isWordActive = idx === currentWordIndex;

                    return (
                      <div
                        key={idx}
                        className={`h-2.5 rounded-full transition-all duration-200 flex-1 ${
                          isWordCompleted
                            ? 'bg-emerald-400 shadow-sm shadow-emerald-400/50'
                            : isWordActive
                            ? 'bg-amber-400 animate-pulse ring-1 ring-amber-300'
                            : 'bg-emerald-900/80 border border-emerald-800/70'
                        }`}
                        title={`${idx + 1}번째 단어 / ${totalWordsInStage}단어`}
                      />
                    );
                  })}
                </div>
                <span className="font-black text-amber-300 shrink-0">
                  {Math.min(currentWordIndex + 1, totalWordsInStage)} / {totalWordsInStage}단어
                </span>
              </div>

              <div className="flex items-center gap-1 text-emerald-400 font-medium shrink-0">
                <Icon name="sparkles" className="w-3.5 h-3.5 text-amber-300 fill-amber-300" />
                <span>7단계 완주 시 "참잘했어요" 수여!</span>
              </div>
            </div>
          </div>
        );
      };

      // --- ScoreBoard Component ---
      const ScoreBoard = ({
        score,
        stageTimeLeft,
        wordTimeLeft,
        currentCPM,
        averageCPM,
        accuracy,
        perfectWordCount,
        herbCount,
      }) => {
        const wordTimePercent = Math.max(0, Math.min(100, (wordTimeLeft / 10) * 100));
        const isWordTimeUrgent = wordTimeLeft <= 3;
        const stageTimePercent = Math.max(0, Math.min(100, (stageTimeLeft / 60) * 100));
        const isStageTimeUrgent = stageTimeLeft <= 10;

        return (
          <div className="w-full grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            {/* 1. Score Card */}
            <div className="bg-emerald-900/60 border border-emerald-700/60 rounded-xl p-3 flex flex-col justify-between shadow-sm">
              <div className="flex items-center justify-between text-xs text-emerald-300 font-medium">
                <span className="flex items-center gap-1">
                  <Icon name="award" className="w-3.5 h-3.5 text-amber-400" />
                  현재 점수
                </span>
                <span className="text-[11px] text-emerald-400 font-normal">단어당 기본 10점</span>
              </div>
              <div className="mt-1 flex items-baseline justify-between">
                <span className="text-3xl font-black text-amber-300 tracking-tight">{score}</span>
                <span className="text-xs font-bold text-amber-400/90">점</span>
              </div>
              <div className="flex items-center gap-2 text-[11px] text-emerald-300/80 mt-1 border-t border-emerald-800/60 pt-1">
                <span>무오타 +3점: <b className="text-emerald-200">{perfectWordCount}회</b></span>
                <span>•</span>
                <span>약초 +10점: <b className="text-amber-200">{herbCount}회</b></span>
              </div>
            </div>

            {/* 2. Typing Speed (CPM) */}
            <div className="bg-emerald-900/60 border border-emerald-700/60 rounded-xl p-3 flex flex-col justify-between shadow-sm">
              <div className="flex items-center justify-between text-xs text-emerald-300 font-medium">
                <span className="flex items-center gap-1">
                  <Icon name="zap" className="w-3.5 h-3.5 text-cyan-400" />
                  타자 속도
                </span>
                <span className="text-[11px] text-cyan-300">실시간 타수</span>
              </div>
              <div className="mt-1 flex items-baseline justify-between">
                <span className="text-3xl font-black text-cyan-300 tracking-tight">{currentCPM}</span>
                <span className="text-xs font-bold text-cyan-400/90">타/분</span>
              </div>
              <div className="flex items-center justify-between text-[11px] text-emerald-300/80 mt-1 border-t border-emerald-800/60 pt-1">
                <span>평균: <b className="text-cyan-200">{averageCPM}타</b></span>
                <span className="flex items-center gap-0.5">
                  <Icon name="target" className="w-3 h-3 text-emerald-300" />
                  정확도: <b className="text-emerald-200">{accuracy}%</b>
                </span>
              </div>
            </div>

            {/* 3. Word Timer (10초 제한) */}
            <div className={`border rounded-xl p-3 flex flex-col justify-between shadow-sm transition-colors ${
              isWordTimeUrgent ? 'bg-rose-950/70 border-rose-500/70 animate-pulse' : 'bg-emerald-900/60 border-emerald-700/60'
            }`}>
              <div className="flex items-center justify-between text-xs font-medium">
                <span className={`flex items-center gap-1 ${isWordTimeUrgent ? 'text-rose-300' : 'text-emerald-300'}`}>
                  <Icon name="clock" className={`w-3.5 h-3.5 ${isWordTimeUrgent ? 'text-rose-400' : 'text-emerald-300'}`} />
                  단어 제한시간
                </span>
                <span className="text-[11px] text-amber-300 font-semibold">10초 제한</span>
              </div>
              <div className="mt-1 flex items-baseline justify-between">
                <span className={`text-3xl font-black tracking-tight ${isWordTimeUrgent ? 'text-rose-300' : 'text-emerald-100'}`}>
                  {wordTimeLeft.toFixed(1)}
                </span>
                <span className={`text-xs font-bold ${isWordTimeUrgent ? 'text-rose-400' : 'text-emerald-400'}`}>초</span>
              </div>
              <div className="w-full bg-emerald-950/80 rounded-full h-1.5 mt-2 overflow-hidden border border-emerald-800/50">
                <div
                  className={`h-full transition-all duration-100 rounded-full ${
                    isWordTimeUrgent ? 'bg-rose-500' : wordTimePercent < 50 ? 'bg-amber-400' : 'bg-emerald-400'
                  }`}
                  style={{ width: `${wordTimePercent}%` }}
                />
              </div>
            </div>

            {/* 4. Stage Round Timer (60초 제한) */}
            <div className={`border rounded-xl p-3 flex flex-col justify-between shadow-sm transition-colors ${
              isStageTimeUrgent ? 'bg-amber-950/70 border-amber-500/70' : 'bg-emerald-900/60 border-emerald-700/60'
            }`}>
              <div className="flex items-center justify-between text-xs font-medium">
                <span className={`flex items-center gap-1 ${isStageTimeUrgent ? 'text-amber-300' : 'text-emerald-300'}`}>
                  <Icon name="timer" className={`w-3.5 h-3.5 ${isStageTimeUrgent ? 'text-amber-400' : 'text-emerald-300'}`} />
                  라운드 제한시간
                </span>
                <span className="text-[11px] text-amber-300 font-semibold">한판 60초</span>
              </div>
              <div className="mt-1 flex items-baseline justify-between">
                <span className={`text-3xl font-black tracking-tight ${isStageTimeUrgent ? 'text-amber-300' : 'text-emerald-100'}`}>
                  {stageTimeLeft}
                </span>
                <span className={`text-xs font-bold ${isStageTimeUrgent ? 'text-amber-400' : 'text-emerald-400'}`}>초</span>
              </div>
              <div className="w-full bg-emerald-950/80 rounded-full h-1.5 mt-2 overflow-hidden border border-emerald-800/50">
                <div
                  className={`h-full transition-all duration-300 rounded-full ${isStageTimeUrgent ? 'bg-rose-400' : 'bg-teal-400'}`}
                  style={{ width: `${stageTimePercent}%` }}
                />
              </div>
            </div>
          </div>
        );
      };

      // --- TypingArea Component ---
      const TypingArea = ({
        currentWord,
        userInput,
        onInputChange,
        onSubmitWord,
        isLargeFont,
        hadMistakeOnCurrentWord,
        lastFeedback,
      }) => {
        const inputRef = useRef(null);

        useEffect(() => {
          if (inputRef.current) {
            inputRef.current.value = '';
            inputRef.current.focus();
          }
        }, [currentWord.id]);

        const targetChars = currentWord.word.split('');
        const jamoGuide = targetChars
          .map((c) => {
            const dec = decomposeChar(c);
            if (dec.isHangul) {
              return [dec.cho, dec.jung, dec.jong].filter(Boolean).join(' ');
            }
            return c;
          })
          .join('  |  ');

        const handleKeyDown = (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (userInput.trim().length > 0) {
              onSubmitWord();
            }
          }
        };

        const isHerb = currentWord.category === 'herb';
        const isMismatch = userInput.length > 0 && !currentWord.word.startsWith(userInput);

        return (
          <div
            onClick={() => inputRef.current?.focus()}
            className={`w-full rounded-3xl border transition-all duration-300 p-6 md:p-8 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl cursor-text ${
              isHerb
                ? 'bg-gradient-to-b from-amber-950/70 via-emerald-950/80 to-emerald-950 border-amber-500/50 shadow-amber-950/40'
                : 'bg-gradient-to-b from-emerald-900/60 via-emerald-950/90 to-emerald-950 border-emerald-700/60 shadow-emerald-950/50'
            }`}
          >
            {/* Word Category Badge */}
            <div className="flex items-center gap-2 mb-3">
              {isHerb ? (
                <div className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-gradient-to-r from-amber-500 to-yellow-500 text-amber-950 font-black text-sm md:text-base shadow-lg shadow-amber-500/30 animate-bounce">
                  <Icon name="sparkles" className="w-4 h-4 fill-amber-950" />
                  <span>약초 보너스 단어 (+10점 추가!)</span>
                  <span className="text-xs bg-amber-950/20 px-2 py-0.5 rounded-full">총 20점~23점</span>
                </div>
              ) : (
                <div className="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-emerald-800/80 text-emerald-200 border border-emerald-600/50 text-sm font-semibold">
                  <Icon name="trees" className="w-4 h-4 text-emerald-300" />
                  <span>나무 이름</span>
                  <span className="text-xs bg-emerald-950/40 px-2 py-0.5 rounded-full text-emerald-300">
                    맞추면 10점 (무오타시 13점)
                  </span>
                </div>
              )}
            </div>

            {/* Target Word in 2X / 2.5X Typography */}
            <div className="my-3 text-center select-none">
              <div
                className={`font-black tracking-widest flex items-center justify-center gap-1 transition-all ${
                  isLargeFont ? 'text-6xl sm:text-7xl md:text-8xl py-2' : 'text-5xl sm:text-6xl md:text-7xl py-1'
                }`}
              >
                {targetChars.map((char, index) => {
                  const userChar = userInput[index];
                  const isTyped = userChar !== undefined;
                  const isMatch = isTyped && userChar === char;
                  const isCurrentTypingIndex = userInput.length === index;

                  return (
                    <span
                      key={index}
                      className={`relative px-1 rounded-xl transition-all duration-150 inline-block ${
                        isMatch
                          ? 'text-emerald-400 scale-105'
                          : isTyped
                          ? 'text-rose-400 underline decoration-rose-500 decoration-wavy'
                          : isCurrentTypingIndex
                          ? isHerb
                            ? 'text-amber-200 underline decoration-amber-400 decoration-4'
                            : 'text-emerald-100 underline decoration-emerald-400 decoration-4'
                          : 'text-slate-400/80'
                      }`}
                    >
                      {char}
                      {isCurrentTypingIndex && (
                        <span className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-3/4 h-1.5 bg-amber-400 rounded-full animate-ping" />
                      )}
                    </span>
                  );
                })}
              </div>

              {/* Jamo decomposition hint */}
              <div className="text-emerald-400/80 font-mono text-xs md:text-sm mt-1 tracking-wider">
                자모 분해 힌트: <span className="text-emerald-200 font-bold">{jamoGuide}</span>
              </div>

              {/* 1-Line Educational Meaning */}
              <p className="mt-2 text-xs sm:text-sm text-emerald-300/90 max-w-lg mx-auto bg-emerald-950/50 px-3 py-1.5 rounded-xl border border-emerald-800/40">
                <span className="text-amber-300 font-bold mr-1">[{currentWord.categoryLabel}] {currentWord.word}:</span>
                {currentWord.meaning}
              </p>
            </div>

            {/* Giant Input Field */}
            <div className="w-full max-w-xl mt-4 relative">
              <input
                key={currentWord.id}
                ref={inputRef}
                type="text"
                value={userInput}
                onChange={(e) => onInputChange(e.target.value)}
                onKeyDown={handleKeyDown}
                autoFocus
                spellCheck={false}
                autoComplete="off"
                placeholder="여기에 단어를 입력하세요 (Enter 또는 Space)"
                className={`w-full text-center font-bold tracking-wider rounded-2xl border-2 transition-all duration-150 shadow-inner bg-emerald-950/90 focus:outline-none focus:ring-4 ${
                  isLargeFont ? 'text-3xl md:text-5xl py-4' : 'text-2xl md:text-4xl py-3.5'
                } ${
                  isMismatch
                    ? 'border-rose-500 text-rose-200 focus:border-rose-400 focus:ring-rose-500/30'
                    : isHerb
                    ? 'border-amber-400/80 text-amber-100 focus:border-amber-300 focus:ring-amber-400/30'
                    : 'border-emerald-500/80 text-white focus:border-emerald-300 focus:ring-emerald-400/30'
                }`}
              />

              {isMismatch && (
                <div className="text-center mt-1.5 text-xs text-rose-300 font-bold flex items-center justify-center gap-1 animate-pulse">
                  <span>⚠️ 오타 감지 (띵-동!) 백스페이스로 지우고 다시 입력하세요</span>
                </div>
              )}

              {lastFeedback && (
                <div
                  className={`absolute -top-12 left-1/2 -translate-x-1/2 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-lg border animate-bounce z-20 ${
                    lastFeedback.type === 'timeout'
                      ? 'bg-rose-950 text-rose-200 border-rose-500'
                      : lastFeedback.type === 'herb'
                      ? 'bg-gradient-to-r from-amber-500 to-yellow-500 text-amber-950 border-amber-300'
                      : 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white border-emerald-400'
                  }`}
                >
                  <Icon name={lastFeedback.type === 'timeout' ? 'alert-circle' : 'check-circle-2'} className="w-4 h-4" />
                  <span>{lastFeedback.text}</span>
                  {lastFeedback.points > 0 && (
                    <span className="bg-black/20 px-2 py-0.5 rounded-full font-black">
                      +{lastFeedback.points}점
                    </span>
                  )}
                </div>
              )}
            </div>

            <div className="flex flex-wrap items-center justify-center gap-4 mt-4 text-xs text-emerald-300/80">
              <span className="flex items-center gap-1">
                <span className="w-2 h-2 rounded-full bg-emerald-400" />
                단어 정답: <b>+10점</b>
              </span>
              <span className="flex items-center gap-1">
                <span className="w-2 h-2 rounded-full bg-amber-400" />
                약초 추가: <b>+10점</b>
              </span>
              <span className="flex items-center gap-1">
                <span className={`w-2 h-2 rounded-full ${hadMistakeOnCurrentWord ? 'bg-rose-400' : 'bg-cyan-400'}`} />
                오타 없이 완성: <b>+3점</b> {hadMistakeOnCurrentWord && <span className="text-rose-400">(오타 발생)</span>}
              </span>
            </div>
          </div>
        );
      };

      // --- StageClearModal Component (1 ~ 6단계) ---
      const StageClearModal = ({
        completedStage,
        stageScore,
        stageCPM,
        stageAccuracy,
        stagePerfectCount,
        onNextStage,
        onRetryStage,
      }) => {
        useEffect(() => {
          sounds.playStageClear();
          const handleKey = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              onNextStage();
            }
          };
          window.addEventListener('keydown', handleKey);
          return () => window.removeEventListener('keydown', handleKey);
        }, [onNextStage]);

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fade-in">
            <div className="bg-gradient-to-b from-emerald-900 to-emerald-950 border border-emerald-600/70 rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl relative overflow-hidden">
              <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-500 mx-auto flex items-center justify-center text-emerald-950 mb-4 shadow-lg shadow-emerald-500/30">
                <Icon name="check-circle-2" className="w-10 h-10 stroke-[2.5]" />
              </div>
              <h3 className="text-2xl font-black text-emerald-100 mb-1">
                {completedStage}단계 완주 성공!
              </h3>

      // --- GrandVictoryModal Component (7단계 완주) ---
      const GrandVictoryModal = ({

        averageCPM,
        maxCPM,

        totalPerfectWords,

        const inputRef = useRef(null);

        useEffect(() => {
          bgm.stop();
          sounds.playGrandVictory();

          const duration = 3.5 * 1000;
          const animationEnd = Date.now() + duration;

          const frame = () => {
            if (typeof confetti === 'function') {
              confetti({ particleCount: 4, angle: 60, spread: 65, origin: { x: 0 }, colors: ['#34d399', '#fbbf24', '#f87171', '#38bdf8', '#a78bfa'] });

            if (Date.now() < animationEnd) {
              requestAnimationFrame(frame);
            }
          };
          frame();
        }, []);

        const formatTime = (secs) => {
          const m = Math.floor(secs / 60);
          const s = secs % 60;
          return `${m}분 ${s}초`;
        };

        const handleSaveRecord = () => {
          if (isSaved) return;
          const trimmed = playerName.trim();
          if (!trimmed) {
            setErrorMessage('이름을 입력해 주세요');
            inputRef.current?.focus();
            return;
          }
          setErrorMessage('');

          const { savedItem, userRank } = saveTypingRecord(trimmed, totalScore);
          setIsSaved(true);
          setSaveSuccessMsg('기록했어요! 🎉');
          setSavedRank(userRank);
          setJustSavedRecord(savedItem);

          sounds.playHerbBonus();
          if (typeof confetti === 'function') {
            confetti({ particleCount: 80, spread: 90, origin: { y: 0.6 }, colors: ['#fbbf24', '#f59e0b', '#10b981', '#38bdf8', '#f43f5e'] });
          }
        };

        const handleKeyDown = (e) => {

            handleSaveRecord();

                  <div className="w-28 h-28 sm:w-32 sm:h-32 rounded-full border-4 border-rose-500 flex flex-col items-center justify-center bg-rose-600/20 text-rose-300 p-2">

                    <span className="text-xl sm:text-2xl font-black tracking-tight text-rose-300 drop-shadow-md">

              {/* Statistics Grid */}

                  <div className="flex items-center gap-1.5 text-xs text-emerald-300 font-medium">
                    <Icon name="award" className="w-3.5 h-3.5 text-amber-400" />

                    {totalScore} <span className="text-xs font-normal text-emerald-300">점</span>

                  <div className="flex items-center gap-1.5 text-xs text-emerald-300 font-medium">

              <div className="bg-emerald-950/90 border-2 border-amber-400/70 rounded-2xl p-4 sm:p-5 mb-5 text-left shadow-xl">

                      <span className="text-sm sm:text-base font-bold text-yellow-300 ml-1">

                      </span>
                    )}
                  </div>

                {/* 대형 버튼 2개 (동일한 디자인으로 또렷하게 표시) */}

                  <button
                    type="button"
                    disabled={isSaved}
                    onClick={handleSaveRecord}

                      isSaved

                        <span>기록 완료</span>
                      </>

                      <>

                        <span>기록 남기기</span>

                  <span>단계 선택 및 단어 도감</span>
                </button>
              </div>
            </div>
          </div>

      // --- HallOfFameModal Component ---

        const [rankingList, setRankingList] = useState(entries);
        const [showConfirmModal, setShowConfirmModal] = useState(false);

        useEffect(() => {
          setRankingList(entries);
        }, [entries]);

        const getRankDisplay = (rank) => {
          if (rank === 1) return { label: '1위', medal: '🥇' };
          if (rank === 2) return { label: '2위', medal: '🥈' };
          if (rank === 3) return { label: '3위', medal: '🥉' };
          return { label: `${rank}위`, medal: '' };
        };

        const handleConfirmClear = () => {
          clearAllTypingRankings();
          setRankingList([]);
          setShowConfirmModal(false);
          if (onCleared) onCleared();
        };

          <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/85 backdrop-blur-md animate-fade-in overflow-y-auto">
            <div className="bg-gradient-to-b from-emerald-950 via-emerald-900 to-slate-950 border-2 border-amber-400/80 rounded-3xl max-w-xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden my-auto relative">
              <div className="p-4 sm:p-5 border-b border-emerald-800/80 flex items-center justify-between bg-emerald-900/70">

                  <Icon name="x" className="w-5 h-5" />

                    </p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {rankingList.slice(0, 10).map((item, idx) => {
                      const { label, medal } = getRankDisplay(item.순위);
                      const isNew = item.isNew;

                      return (
                        <div
                          key={`${item.날짜}-${item.이름}-${idx}`}
                          className={`grid grid-cols-12 gap-2 items-center p-3 rounded-2xl border transition-all ${
                            isNew
                              ? 'bg-yellow-400/25 border-2 border-yellow-400 ring-2 ring-yellow-400/60 shadow-lg shadow-yellow-500/20 text-yellow-100 animate-pulse'

                              ? 'bg-emerald-900/60 border-emerald-700/80 text-emerald-100'

                      <Icon name="alert-triangle" className="w-8 h-8 animate-bounce" />

      const StageSelectorModal = ({ currentStage, completedStages, onSelectStage, onClose }) => {

              <div className="flex border-b border-emerald-800/80 bg-emerald-950/70 px-4 pt-2 gap-2 text-sm">

                  className={`pb-2.5 px-3 font-bold border-b-2 transition-all ${

                </button>

              <div className="p-4 md:p-5 overflow-y-auto space-y-3 flex-1">
                {activeTab === 'stages' ? (
                  <div className="space-y-3">
                    {STAGE_CONFIGS.map((stageItem) => {

                      const isCompleted = completedStages.includes(stageItem.stage);

                      return (
                        <div
                          key={stageItem.stage}
                          className={`p-3.5 md:p-4 rounded-2xl border transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                            isCurrent
                              ? 'bg-emerald-900/80 border-amber-400/80 ring-2 ring-amber-400/30'

                              ? 'bg-emerald-900/40 border-emerald-700/60'

                        >

                                {stageItem.title}
                              </span>
                              {isCompleted && (
                                <span className="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-300 bg-emerald-900/80 px-2 py-0.5 rounded-full border border-emerald-600/50">
                                  <Icon name="check" className="w-3 h-3" /> 완료
                                </span>
                              )}
                              {isCurrent && (
                                <span className="inline-flex items-center text-[11px] font-bold text-amber-300 bg-amber-950/80 px-2 py-0.5 rounded-full border border-amber-600/50">
                                  진행 중
                                </span>
                              )}
                            </div>
                            <p className="text-xs text-emerald-300/80 mt-1">
                              {stageItem.subtitle}
                            </p>
                            <div className="flex flex-wrap gap-1.5 mt-2">
                              {stageItem.words.map((w) => (
                                <span
                                  key={w.id}

                                    w.category === 'herb'
                                      ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold'
                                      : 'bg-emerald-950/70 text-emerald-200 border border-emerald-800'
                                  }`}
                                >
                                  <span>{w.word}</span>
                                  {w.category === 'herb' && (
                                    <Icon name="sparkles" className="w-3 h-3 text-amber-400 fill-amber-400" />

                                </span>
                              ))}

                          </div>

                          <button
                            onClick={() => {
                              onSelectStage(stageItem.stage);
                              onClose();
                            }}
                            className="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-emerald-950 font-black text-sm flex items-center justify-center gap-1.5 shadow-md active:scale-95 transition-transform cursor-pointer"
                          >
                            <Icon name="play" className="w-3.5 h-3.5 fill-emerald-950" />

                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    {POOL_100_NATURE_WORDS.map((item) => (
                      <div
                        key={item.id}
                        className={`p-3 rounded-xl border flex flex-col justify-between ${
                          item.category === 'herb'
                            ? 'bg-amber-950/30 border-amber-600/40'
                            : 'bg-emerald-900/30 border-emerald-800/60'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-base font-black text-emerald-100 flex items-center gap-1.5">
                            <span className="text-lg">{item.badge}</span>
                            {item.word}
                          </span>
                          {item.category === 'herb' ? (
                            <span className="text-[11px] font-bold text-amber-300 bg-amber-950 px-2 py-0.5 rounded-full border border-amber-500/50 flex items-center gap-1">
                              <Icon name="sparkles" className="w-3 h-3 text-amber-400 fill-amber-400" /> 약초 (+10점)
                            </span>
                          ) : (
                            <span className="text-[11px] font-semibold text-emerald-300 bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-700/60 flex items-center gap-1">

                            </span>
                          )}

                          {item.meaning}

                    ))}
                  </div>
                )}
              </div>

              <div className="p-3 border-t border-emerald-800/80 bg-emerald-950/90 text-center text-xs text-emerald-400">
                총 7단계 완성 시 <span className="text-amber-300 font-bold">"참잘했어요"</span> 인증 스탬프가 수여됩니다.
              </div>
            </div>
          </div>
        );
      };

      // =========================================================================
      // 7. MAIN APP COMPONENT
      // =========================================================================
      function App() {
        const [currentStageNum, setCurrentStageNum] = useState(1);
        const [currentWordIdx, setCurrentWordIdx] = useState(0);
        const [completedStages, setCompletedStages] = useState([]);
        const [isGameActive, setIsGameActive] = useState(true);

        const [userInput, setUserInput] = useState('');
        const [hadMistakeOnCurrentWord, setHadMistakeOnCurrentWord] = useState(false);

        const [totalScore, setTotalScore] = useState(0);
        const [perfectWordCount, setPerfectWordCount] = useState(0);
        const [herbCount, setHerbCount] = useState(0);

        const [currentCPM, setCurrentCPM] = useState(0);
        const [averageCPM, setAverageCPM] = useState(0);
        const [maxCPM, setMaxCPM] = useState(0);
        const [accuracy, setAccuracy] = useState(100);

        const totalCorrectStrokesRef = useRef(0);
        const totalTypedStrokesRef = useRef(0);
        const totalTypingSecondsRef = useRef(0);
        const wordStartTimeRef = useRef(Date.now());
        const gameStartTimestampRef = useRef(Date.now());
        const isAdvancingRef = useRef(false);
        const isCurrentInputWrongRef = useRef(false);

        const [stageTimeLeft, setStageTimeLeft] = useState(60);
        const [wordTimeLeft, setWordTimeLeft] = useState(10.0);

        const [lastFeedback, setLastFeedback] = useState(null);

        const [showStageClearModal, setShowStageClearModal] = useState(false);
        const [showGrandVictoryModal, setShowGrandVictoryModal] = useState(false);
        const [showStageSelector, setShowStageSelector] = useState(false);
        const [showHallOfFameModal, setShowHallOfFameModal] = useState(false);
        const [justSavedRecord, setJustSavedRecord] = useState(null);
        const [isStageTimeout, setIsStageTimeout] = useState(false);

        const [stageScoreDelta, setStageScoreDelta] = useState(0);
        const [stageInitialScore, setStageInitialScore] = useState(0);
        const [stagePerfectDelta, setStagePerfectDelta] = useState(0);
        const stageInitialPerfectRef = useRef(0);

        const [isMuted, setIsMuted] = useState(sounds.getMuted());
        const [isLargeFont, setIsLargeFont] = useState(false);

        const currentStageConfig = STAGE_CONFIGS.find((s) => s.stage === currentStageNum) || STAGE_CONFIGS[0];
        const [stageWords, setStageWords] = useState(() => getRandomWords(20));
        const currentWord = stageWords[currentWordIdx] || stageWords[0] || currentStageConfig.words[0];

        const resetWordState = useCallback(() => {
          setUserInput('');
          setHadMistakeOnCurrentWord(false);
          isCurrentInputWrongRef.current = false;
          setWordTimeLeft(10.0);
          wordStartTimeRef.current = Date.now();
          setTimeout(() => {
            isAdvancingRef.current = false;
          }, 60);
        }, []);

        const advanceToNextWord = useCallback(() => {
          if (currentWordIdx + 1 < stageWords.length) {
            setCurrentWordIdx((prev) => prev + 1);
            resetWordState();
          } else {
            setCompletedStages((prev) => (prev.includes(currentStageNum) ? prev : [...prev, currentStageNum]));
            setIsGameActive(false);

            if (currentStageNum === 7) {
              bgm.stop();
              setShowGrandVictoryModal(true);
            } else {
              bgm.pause();
              const delta = totalScore - stageInitialScore;
              setStageScoreDelta(delta > 0 ? delta : 0);
              setStagePerfectDelta(perfectWordCount - stageInitialPerfectRef.current);
              setShowStageClearModal(true);
            }
          }
        }, [currentWordIdx, stageWords.length, currentStageNum, totalScore, stageInitialScore, perfectWordCount, resetWordState]);

        const handleWordComplete = useCallback(() => {
          isAdvancingRef.current = true;
          setUserInput('');

          const elapsedSecs = Math.max(0.3, (Date.now() - wordStartTimeRef.current) / 1000);
          const wordStrokes = countKoreanStrokes(currentWord.word);

          const wordCPM = calculateCPM(wordStrokes, elapsedSecs);
          setCurrentCPM(wordCPM);
          setMaxCPM((prev) => Math.max(prev, wordCPM));

          totalCorrectStrokesRef.current += wordStrokes;
          totalTypingSecondsRef.current += elapsedSecs;
          const newAvgCPM = calculateCPM(totalCorrectStrokesRef.current, totalTypingSecondsRef.current);
          setAverageCPM(newAvgCPM);

          let points = 10;
          let feedbackText = '정답!';
          let feedbackType = 'normal';

          const isHerb = currentWord.category === 'herb';
          const isPerfect = !hadMistakeOnCurrentWord;

          if (isHerb) {
            points += 10;
            setHerbCount((prev) => prev + 1);
            feedbackType = 'herb';
            feedbackText = '🌿 약초 보너스!';
            sounds.playHerbBonus();
          } else {
            sounds.playWordCorrect();
          }

          if (isPerfect) {
            points += 3;
            setPerfectWordCount((prev) => prev + 1);
            if (!isHerb) {
              feedbackType = 'perfect';
              feedbackText = '🎯 무오타 보너스!';
              sounds.playPerfectBonus();
            } else {
              feedbackText = '🌿 약초 + 🎯 무오타 완성!';
            }
          }

          setTotalScore((prev) => prev + points);
          setStageTimeLeft((prev) => Math.min(60, prev + 2.5));

          if (typeof confetti === 'function') {
            confetti({
              particleCount: 45,
              spread: 75,
              origin: { y: 0.65 },
              colors: isHerb
                ? ['#fbbf24', '#f59e0b', '#10b981', '#34d399', '#fef08a']
                : ['#34d399', '#10b981', '#059669', '#38bdf8', '#fbbf24'],
            });
          }

          setLastFeedback({ text: feedbackText, type: feedbackType, points });
          setTimeout(() => setLastFeedback(null), 1500);

          advanceToNextWord();
        }, [currentWord, hadMistakeOnCurrentWord, advanceToNextWord]);

        useEffect(() => {
          bgm.play().catch(() => {});
        }, []);

        const handleInputChange = (val) => {
          if (isAdvancingRef.current) return;

          const target = currentWord.word;
          totalTypedStrokesRef.current = Math.max(totalCorrectStrokesRef.current, totalTypedStrokesRef.current + 1);

          const isMismatch = val.length > 0 && !target.startsWith(val);
          if (isMismatch) {
            setHadMistakeOnCurrentWord(true);
            if (!isCurrentInputWrongRef.current) {
              sounds.playDingDongWrong();
              isCurrentInputWrongRef.current = true;
            }
          } else {
            isCurrentInputWrongRef.current = false;
            sounds.playKeypress();
          }

          const calcAccuracy = Math.min(
            100,
            Math.max(0, Math.round((totalCorrectStrokesRef.current / Math.max(1, totalTypedStrokesRef.current)) * 100))
          );
          setAccuracy(calcAccuracy);

          if (val.trim() === target) {
            isAdvancingRef.current = true;
            setUserInput('');
            handleWordComplete();
            return;
          }

          setUserInput(val);
        };

        // 10s word timer & 60s stage timer
        useEffect(() => {
          if (!isGameActive || showStageClearModal || showGrandVictoryModal || showStageSelector || showHallOfFameModal || isStageTimeout) {
            return;
          }

          const interval = setInterval(() => {
            setWordTimeLeft((prev) => {
              const next = Math.max(0, prev - 0.1);
              if (next <= 0) {
                sounds.playTimeout();
                setLastFeedback({ text: '시간 초과! 다음 단어로 이동', type: 'timeout', points: 0 });
                setTimeout(() => setLastFeedback(null), 1200);
                advanceToNextWord();
                return 10.0;
              }
              return Number(next.toFixed(1));
            });

            setStageTimeLeft((prev) => {
              const next = prev - 0.1;
              if (next <= 0) {
                sounds.playTimeout();
                bgm.pause();
                setIsGameActive(false);
                setIsStageTimeout(true);
                return 0;
              }
              return Number(next.toFixed(1));
            });
          }, 100);

          return () => clearInterval(interval);
        }, [isGameActive, showStageClearModal, showGrandVictoryModal, showStageSelector, showHallOfFameModal, isStageTimeout, advanceToNextWord]);

        const handleRestartStage = useCallback(() => {
          setStageWords(getRandomWords(20));
          setCurrentWordIdx(0);
          setStageTimeLeft(60);
          setIsStageTimeout(false);
          setIsGameActive(true);
          setShowStageClearModal(false);
          resetWordState();
          setStageInitialScore(totalScore);
          stageInitialPerfectRef.current = perfectWordCount;
          bgm.play().catch(() => {});
        }, [totalScore, perfectWordCount, resetWordState]);

        const handleShuffleWords = useCallback(() => {
          setStageWords(getRandomWords(20));
          setCurrentWordIdx(0);
          setStageTimeLeft(60);
          setIsStageTimeout(false);
          setIsGameActive(true);
          resetWordState();
        }, [resetWordState]);

        const handleNextStage = useCallback(() => {
          if (currentStageNum < 7) {
            const nextStage = currentStageNum + 1;
            setCurrentStageNum(nextStage);
            setStageWords(getRandomWords(20));
            setCurrentWordIdx(0);
            setStageTimeLeft(60);
            setIsStageTimeout(false);
            setIsGameActive(true);
            setShowStageClearModal(false);
            resetWordState();
            setStageInitialScore(totalScore);
            stageInitialPerfectRef.current = perfectWordCount;
            bgm.play().catch(() => {});
          } else {
            bgm.stop();
            setShowGrandVictoryModal(true);
          }
        }, [currentStageNum, totalScore, perfectWordCount, resetWordState]);

        const handleSelectStage = useCallback((stageNum) => {
          setCurrentStageNum(stageNum);
          setStageWords(getRandomWords(20));
          setCurrentWordIdx(0);
          setStageTimeLeft(60);
          setIsStageTimeout(false);
          setIsGameActive(true);
          setShowStageClearModal(false);
          setShowGrandVictoryModal(false);
          resetWordState();
          bgm.play().catch(() => {});
        }, [resetWordState]);

        const handleRestartAll = useCallback(() => {
          setCurrentStageNum(1);
          setStageWords(getRandomWords(20));
          setCurrentWordIdx(0);
          setCompletedStages([]);
          setTotalScore(0);
          setPerfectWordCount(0);
          setHerbCount(0);
          setCurrentCPM(0);
          setAverageCPM(0);
          setMaxCPM(0);
          setAccuracy(100);
          totalCorrectStrokesRef.current = 0;
          totalTypedStrokesRef.current = 0;
          totalTypingSecondsRef.current = 0;
          gameStartTimestampRef.current = Date.now();
          setStageTimeLeft(60);
          setIsStageTimeout(false);
          setIsGameActive(true);
          setShowStageClearModal(false);
          setShowGrandVictoryModal(false);
          resetWordState();
          bgm.play().catch(() => {});
        }, [resetWordState]);

        const toggleMute = () => setIsMuted(sounds.toggleMute());
        const toggleFontSize = () => setIsLargeFont((p) => !p);
        const totalGameElapsed = Math.round((Date.now() - gameStartTimestampRef.current) / 1000);

        return (
          <div className="min-h-screen bg-gradient-to-b from-emerald-950 via-emerald-900 to-slate-950 text-slate-100 flex flex-col justify-between selection:bg-emerald-400 selection:text-emerald-950">
            <Header
              currentStage={currentStageNum}
              totalStages={STAGE_CONFIGS.length}
              isMuted={isMuted}
              onToggleMute={toggleMute}
              onRestartCurrent={handleRestartStage}
              onOpenStageSelect={() => setShowStageSelector(true)}
              onShuffleWords={handleShuffleWords}
              isLargeFont={isLargeFont}
              onToggleFontSize={toggleFontSize}
              onOpenHallOfFame={() => setShowHallOfFameModal(true)}
            />

            <main className="max-w-4xl w-full mx-auto px-4 py-5 flex-1 flex flex-col gap-4 justify-center">
              <StageProgress
                currentStage={currentStageNum}
                completedStages={completedStages}
                currentWordIndex={currentWordIdx}
                totalWordsInStage={stageWords.length}
              />

              <ScoreBoard
                score={totalScore}
                stageTimeLeft={Math.ceil(stageTimeLeft)}
                wordTimeLeft={wordTimeLeft}
                currentCPM={currentCPM}
                averageCPM={averageCPM}
                accuracy={accuracy}
                perfectWordCount={perfectWordCount}
                herbCount={herbCount}
              />

              {/* 시작 화면 🏆 명예의 전당 바로가기 바 */}
              <div className="flex items-center justify-between gap-3 bg-emerald-950/70 border border-emerald-800/80 rounded-2xl px-3.5 py-2 shadow-sm">
                <button
                  type="button"
                  onClick={() => setShowHallOfFameModal(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500/25 to-yellow-500/15 hover:from-amber-500/35 hover:to-yellow-500/25 text-amber-300 border border-amber-400/60 font-black text-xs sm:text-sm transition-all active:scale-95 shadow-sm cursor-pointer"
                >
                  <span className="text-base">🏆</span>
                  <span>명예의 전당 (순위표)</span>
                </button>
                <span className="text-xs text-emerald-300/80 hidden sm:inline">
                  7단계를 완주하고 내 이름을 명예의 전당에 올려보세요!
                </span>
              </div>

              {isStageTimeout ? (
                <div className="w-full bg-rose-950/80 border-2 border-rose-500/70 rounded-3xl p-8 text-center shadow-2xl flex flex-col items-center justify-center">
                  <Icon name="alert-triangle" className="w-16 h-16 text-rose-400 mb-3 animate-bounce" />
                  <h2 className="text-2xl font-black text-rose-100 mb-2">
                    60초 제한시간이 종료되었습니다!
                  </h2>
                  <p className="text-rose-200/90 text-sm max-w-md mb-6">
                    한판 60초 안에 20개 단어를 모두 입력해야 합니다. 다시 한 번 도전해 보세요!
                  </p>
                  <button
                    onClick={handleRestartStage}
                    className="py-3 px-6 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-amber-950 font-black text-base transition-all transform active:scale-95 shadow-lg shadow-amber-500/30 flex items-center gap-2 cursor-pointer"
                  >
                    <Icon name="rotate-ccw" className="w-5 h-5 stroke-[2.5]" />
                    {currentStageNum}단계 다시 시작하기
                  </button>
                </div>
              ) : (
                <TypingArea
                  currentWord={currentWord}
                  userInput={userInput}
                  onInputChange={handleInputChange}
                  onSubmitWord={() => {
                    if (userInput.trim() === currentWord.word) {
                      handleWordComplete();
                    }
                  }}
                  isLargeFont={isLargeFont}
                  hadMistakeOnCurrentWord={hadMistakeOnCurrentWord}
                  lastFeedback={lastFeedback}
                />
              )}
            </main>

            <footer className="w-full border-t border-emerald-900/60 bg-emerald-950/80 py-3 px-4 text-center text-xs text-emerald-400/80">
              <div className="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
                <span>🌿 7단계 완성 시 <b>"참잘했어요"</b> 칭찬 스탬프 수여</span>
                <span className="flex items-center gap-1.5 text-amber-300 font-semibold">
                  <Icon name="music" className="w-3.5 h-3.5 text-amber-400" />
                  배경음악: cybernetic-overload (무한 반복 재생)
                </span>
                <span>⚡ 단어당 10초 · 라운드당 60초 · 약초 +10점 가산점</span>
              </div>
            </footer>

            {showStageClearModal && (
              <StageClearModal
                completedStage={currentStageNum}
                stageScore={stageScoreDelta}
                stageCPM={averageCPM}
                stageAccuracy={accuracy}
                stagePerfectCount={stagePerfectDelta}
                onNextStage={handleNextStage}
                onRetryStage={handleRestartStage}
              />
            )}

            {showGrandVictoryModal && (
              <GrandVictoryModal
                totalScore={totalScore}
                averageCPM={averageCPM}
                maxCPM={maxCPM}
                overallAccuracy={accuracy}
                totalPerfectWords={perfectWordCount}
                totalHerbsTyped={herbCount}
                elapsedSeconds={totalGameElapsed}
                onRestartAll={handleRestartAll}
                onOpenStageSelect={() => {
                  setShowGrandVictoryModal(false);
                  setShowStageSelector(true);
                }}
                onOpenHallOfFame={(savedRecord) => {
                  if (savedRecord) setJustSavedRecord(savedRecord);
                  setShowGrandVictoryModal(false);
                  setShowHallOfFameModal(true);
                }}
              />
            )}

            {showStageSelector && (
              <StageSelectorModal
                currentStage={currentStageNum}
                completedStages={completedStages}
                onSelectStage={handleSelectStage}
                onClose={() => setShowStageSelector(false)}
              />
            )}

            {showHallOfFameModal && (
              <HallOfFameModal
                entries={getProcessedRankings(justSavedRecord)}
                onClose={() => setShowHallOfFameModal(false)}
                onRestartAll={handleRestartAll}
                onCleared={() => setJustSavedRecord(null)}
              />
            )}
          </div>
        );
      }

      // Render App
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
